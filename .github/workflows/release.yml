name: Release

# A pushed tag vX.Y.Z builds plimsoll for macOS, Linux and Windows on amd64 and arm64, packs the MCP bundle, publishes
# the binaries, the bundle and their SHA-256 checksums as the tag's GitHub release, and then lists the release in the
# official MCP registry. The tag must match the version in cmd/plimsoll/detectors.go and in server.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # mcp-publisher logs in to the MCP registry with the workflow's OIDC token

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: The tag matches the version
        run: |
          want=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/plimsoll/detectors.go)
          test "$TAG" = "v$want" || { echo "tag $TAG does not match version $want"; exit 1; }
      - name: Build
        # The same Go image as CI; static binaries, no build paths, no VCS stamp. The container writes dist/ as root,
        # so every file of the release is put there inside it.
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GOTOOLCHAIN=local -e CGO_ENABLED=0 \
            golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9 \
            sh -euc 'for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
              suffix=; [ "${target%/*}" = windows ] && suffix=.exe
              GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -buildvcs=false -ldflags="-s -w" \
                -o "dist/plimsoll_${target%/*}_${target#*/}$suffix" ./cmd/plimsoll
            done
            cp THIRD_PARTY_NOTICES.md dist/
            cd dist && sha256sum plimsoll_* > checksums.txt'
          cat dist/checksums.txt
      - name: Bundle
        # The container wrote dist/ as root.
        run: |
          sudo chown -R "$(id -u)" dist
          mcpb/pack.sh dist "${TAG#v}" server.release.json
          (cd dist && sha256sum plimsoll.mcpb >> checksums.txt)
      - name: Publish
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: List the release in the MCP registry
        run: |
          mcpb/publisher.sh .
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.release.json
