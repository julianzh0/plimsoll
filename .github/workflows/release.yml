name: Release

# A pushed tag vX.Y.Z builds plimsoll for macOS and Linux on amd64 and arm64 and publishes the binaries and their
# SHA-256 checksums as the tag's GitHub release. The tag must match the version in cmd/plimsoll/detectors.go.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: The tag matches the version
        run: |
          want=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/plimsoll/detectors.go)
          test "$TAG" = "v$want" || { echo "tag $TAG does not match version $want"; exit 1; }
      - name: Build
        # The same Go image as CI; static binaries, no build paths, no VCS stamp.
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GOTOOLCHAIN=local -e CGO_ENABLED=0 \
            golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9 \
            sh -euc 'for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -buildvcs=false -ldflags="-s -w" \
                -o "dist/plimsoll_${target%/*}_${target#*/}" ./cmd/plimsoll
            done
            cd dist && sha256sum plimsoll_* > checksums.txt'
          cat dist/checksums.txt
          cp THIRD_PARTY_NOTICES.md dist/
      - name: Publish
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
