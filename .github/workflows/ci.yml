name: CI

# Every push to main and every pull request runs make qa on GitHub-hosted arm64 and amd64 runners, and the unit and
# integration tests on a Windows runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's superseded run is cancelled; a run on main has a group of its own and is never cancelled.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    timeout-minutes: 20
    container:
      # trixie, not bookworm: plimsoll needs git 2.45 or later (bookworm ships 2.39).
      image: golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make install-golangci-lint BINDIR=/usr/local/bin
      - run: make qa
      # Coverage from the qa run above, as information in the run's summary; it never fails the job.
      - name: Coverage
        continue-on-error: true
        run: |
          {
            echo "### Coverage (${{ matrix.runner }})"
            echo '```'
            make -s cover-report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The unit and integration tests on Windows with Git for Windows' defaults (line endings converted on checkout), so
  # paths with spaces or other letters, separators and CRLF files are checked where users meet them.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: git --version
      - run: go test -count=1 -shuffle=on -p 1 ./...
      - run: go test -count=1 -shuffle=on -p 1 -tags integration -run '^TestIntegration' ./...

  # The MCP bundle the release attaches: packed from this tree, started as a client starts it on this runner's
  # processor, and its server.json validated by the MCP registry.
  bundle:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GOTOOLCHAIN=local -e CGO_ENABLED=0 --user "$(id -u):$(id -g)" -e HOME=/tmp \
            golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9 \
            sh -euc 'for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
              suffix=; [ "${target%/*}" = windows ] && suffix=.exe
              GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -buildvcs=false -ldflags="-s -w" \
                -o "dist/plimsoll_${target%/*}_${target#*/}$suffix" ./cmd/plimsoll
            done'
      - name: Pack
        run: mcpb/pack.sh dist "$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/plimsoll/detectors.go)" server.release.json
      - name: Start the bundle
        run: |
          mkdir bundle && cd bundle && unzip -q ../dist/plimsoll.mcpb
          # The server ends at the end of its input, so the input stays open until the answer is read.
          timeout 20 python3 -c '
          import json, subprocess
          server = subprocess.Popen(["sh", "server/plimsoll.sh"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          server.stdin.write(json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}}}) + "\n")
          server.stdin.flush()
          answer = json.loads(server.stdout.readline())
          server.stdin.close()
          print(answer["result"]["serverInfo"])
          assert server.wait() == 0
          '
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Validate server.json
        run: |
          mcpb/publisher.sh .
          ./mcp-publisher validate server.release.json
