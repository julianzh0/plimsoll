name: A mark is wrong
description: plimsoll reported something that is not there, missed something that is, or measured it wrongly.
labels: ["wrong mark"]
body:
  - type: textarea
    id: mark
    attributes:
      label: The mark
      description: The mark's lines exactly as `status` or `report` printed them.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What `explain` says
      description: The answer of `explain` for this mark, if you have it.
      render: text
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: What is actually in the code, with file and line.
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository and base
      description: A public repository and the base you asked with, or a small example that shows it.
  - type: input
    id: version
    attributes:
      label: plimsoll version
      description: The output of `plimsoll --version`.
    validations:
      required: true
